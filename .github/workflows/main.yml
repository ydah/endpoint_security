name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rake test:sanitize
      - run: bundle exec gem build endpoint_security.gemspec
